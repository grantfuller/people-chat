[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "people-chat"
version = "0.1.0"
description = "AI-powered HR data analyst. Ask questions in English, get answers from your data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Grant Fuller"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Human Resources",
    "Topic :: Office/Business :: Human Resources",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.0",
    "rich>=13.0",
    "plotly>=5.15",
    "openai>=1.0",
    "anthropic>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
test = ["pytest>=7.0"]

[project.scripts]
people-chat = "people_chat.cli:main"

[tool.setuptools.packages.find]
include = ["people_chat*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
